services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing_dev_password
      POSTGRES_DB: ticketing_dev
    ports:
      # Host port 5433, not 5432, so it can't clash with a Postgres installed
      # on the computer itself (README, Getting started).
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ticketing']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # Local mail catcher (Phase 12): the backend sends to it when
  # SMTP_HOST=localhost, SMTP_PORT=1025; read the emails at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

  # The whole platform in containers, built like the live site (docs/deploy.md):
  #   docker compose up -d --build
  # then http://localhost:3000. Day-to-day development runs the apps with
  # npm instead (README, Getting started); these two services are optional.
  backend:
    build:
      context: ./apps/backend
    restart: unless-stopped
    ports:
      - '4000:4000'
    # Apply database changes and add the categories, then start.
    command: sh -c "npx prisma migrate deploy && node scripts/setup.js && node dist/main.js"
    environment:
      NODE_ENV: development
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: postgresql://ticketing:ticketing_dev_password@postgres:5432/ticketing_dev?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev-only-access-secret-change-me
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      ALLOW_MOCK_PAYMENTS: 'true'
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads:
